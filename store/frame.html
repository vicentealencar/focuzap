<!doctype html>
<!-- Wraps a raw screenshot in a 1280x800 store screenshot with a caption.
     Used by render.sh: frame.html?img=raw/1.png&title=...&sub=... -->
<html><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: radial-gradient(120% 140% at 0% 0%, #0b7a6c 0%, #075E54 45%, #053f38 100%);
    color: #fff; display: flex; flex-direction: column; align-items: center;
  }
  header { height: 150px; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  h1 { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
  p { font-size: 21px; color: #c9f5da; margin-top: 8px; }
  .shot { flex: 1; width: 1160px; overflow: hidden; border-radius: 14px 14px 0 0; box-shadow: 0 20px 50px rgba(0,0,0,.35); background: #fff; }
  .shot img { width: 100%; display: block; }
</style></head>
<body>
  <header><h1 id="t"></h1><p id="s"></p></header>
  <div class="shot"><img id="i"></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('t').textContent = q.get('title') || '';
    document.getElementById('s').textContent = q.get('sub') || '';
    document.getElementById('i').src = q.get('img');
  </script>
</body></html>
